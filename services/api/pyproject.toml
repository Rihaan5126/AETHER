[project]
name = "aether-api"
version = "0.1.0"
description = "AETHER FastAPI service and Celery worker"
requires-python = ">=3.12"
dependencies = [
  "trading-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "python-multipart>=0.0.9",
  "psutil>=6.0",
]

[project.scripts]
aether = "aether_api.cli:main"

[tool.uv.sources]
trading-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aether_api"]
