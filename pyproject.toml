[project]
name = "aether-workspace"
version = "0.1.0"
description = "AETHER - Autonomous Evolutionary Trading Arena (workspace root)"
requires-python = ">=3.12"
dependencies = ["trading-engine", "aether-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/trading_engine", "services/api"]

[tool.uv.sources]
trading-engine = { workspace = true }
aether-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-redis",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "services/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["B027", "UP046", "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RUF012", "N803", "N806"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
                          "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["packages/trading_engine/tests", "services/api/tests"]
addopts = "-ra"
markers = ["slow: trains real models; deselect with -m 'not slow'"]
filterwarnings = ["ignore:The .generic. unit for NumPy timedelta:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["packages/trading_engine/src", "services/api/aether_api"]
