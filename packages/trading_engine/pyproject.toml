[project]
name = "trading-engine"
version = "0.1.0"
description = "AETHER research engine: data, features, agents, simulator, tournaments, evolution"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "torch>=2.4",
  "joblib>=1.4",
  "optuna>=4.0,<5",
  "structlog>=24.4",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_engine"]
